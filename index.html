<style>
  :root {

  /* Transicoes iguais ao original: entra (opacidade 0, escala .95, y 10) e sai (escala .92, y -10) em 0.2s */

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 18px; border-radius: 12px;

  /* Questão */

  .q-badge { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; background: var(--enem-yellow); color: var(--enem-navy); display: grid; place-items: center; box-shadow: 0 0 0 6px #fff4cf; animation: pop .35s cubic-bezier(.34,1.56,.64,1); }

  .q-text { font-family: 'Source Serif 4', Georgia, serif; font-size: 19px; line-height: 1.4; font-weight: 600; text-align: center; margin: 0 0 20px; color: var(--ink); }

  @media (min-width: 640px) { .options { max-height: none; } }
  .opt {

    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover { border-color: var(--enem-blue); background: #f4f8ff; transform: translateY(-2px); }
  .opt:active { transform: scale(.95); }

  .opt .label { flex: 1; font-size: 15px; font-weight: 500; line-height: 1.35; }

  .opt .ico svg { width: 20px; height: 20px; }

  .inter-text { font-size: 14px; line-height: 1.6; font-weight: 600; color: rgba(255,255,255,.95); margin: 0 0 22px; }

  // ---------- Telas ----------
  function screenStart() {
    return '<div class="sheet screen-enter">' + sheetHead('Identificação') +
      '<div class="sheet-body">' +
        '<div class="hero-icon">' + icon('book-open') + '</div>' +
        '<h1 class="title">Eaii! Quero muito te ajudar a destravar sua nota no ENEM e parar de sofrer com aqueles textos gigantescos' + icon('book-open', 2.4).replace('class="icon"', 'class="icon inline-icon"') + '</h1>' +
        '<p class="lead">Mas antes, preciso saber seu nome e o curso que você quer passar. <br><br> Assim eu consigo te mostrar um atalho que faça sentido pro seu objetivo.</p>' +
        '<label class="field"><span class="field-label">' + icon('user') + 'Nome do participante</span><input id="in-name" type="text" placeholder="Seu nome" autocomplete="given-name"></label>' +
        '<label class="field"><span class="field-label">' + icon('graduation') + 'Curso pretendido</span><input id="in-goal" type="text" placeholder="Qual curso você quer passar?"></label>' +
        '<div style="padding-top:8px"><button id="btn-start" class="btn btn-primary" disabled>Começar ' + icon('chevron-right', 2.6) + '</button></div>' +
      '</div></div>';
  }
  function bindStart() {
    var n = document.getElementById('in-name'), g = document.getElementById('in-goal'), b = document.getElementById('btn-start');
    function check() { b.disabled = !(n.value.trim() && g.value.trim()); }
    n.addEventListener('input', check); g.addEventListener('input', check);
    function go() {
      if (b.disabled) return;
      unlockAudio();
      state.name = n.value; state.mainGoal = g.value;
      goTo(1);
    }
    b.addEventListener('click', go);
    [n, g].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); });
  }

  function screenQuestion(q) {
    var num = q.id < 10 ? '0' + q.id : q.id;
    var opts = q.options.map(function (o, k) {
      return '<button class="opt" data-value="' + esc(o.value) + '"><span class="bubble">' + LETTERS[k] + '</span><span class="label">' +
        esc(o.label) + '</span><span class="ico">' + icon(o.icon) + '</span></button>';
    }).join('');
    return '<div class="sheet screen-enter">' + sheetHead(num + ' / 07') +
      '<div class="sheet-body">' +
        '<div class="q-badge">' + icon(q.headerIcon) + '</div>' +
        '<div class="q-label"><span class="q-num">Questão ' + num + '</span></div>' +
        '<h2 class="q-text">' + esc(q.question) + '</h2>' +
        '<div class="options">' + opts + '</div>' +
      '</div></div>';
  }
  function bindQuestion(q) {
    app.querySelectorAll('.opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (busy) return;
        btn.classList.add('marked');
        state.answers[q.id] = btn.getAttribute('data-value');
        next();
      });
    });
  }

  function autoAdvance(barEl, ms) {
    var p = 0;
    var iv = setInterval(function () { p = Math.min(100, p + 1); barEl.style.width = p + '%'; if (p >= 100) clearInterval(iv); }, 80);
    var to = setTimeout(next, ms);
    cleanup.push(function () { clearInterval(iv); clearTimeout(to); });
  }

  function screenEmpathy() {
    return '<div class="sheet screen-enter"><div class="interstitial blue" id="tap">' +
      '<div class="big-icon in-pop d1">' + icon('face-frown', 1.5) + '</div>' +
      '<h2 class="inter-title in-up d2">Eu entendo exatamente como você se sente... Ler aqueles textos infinitos drena toda a nossa energia e o tempo da prova parece que voa, né?</h2>' +
      '<div style="width:100%;padding-top:16px"><div class="inter-bar"><div id="bar"></div></div>' +
      '<p class="inter-hint">Clique na tela para continuar ou aguarde...</p></div>' +
    '</div></div>';
  }
  function bindTap() {
    document.getElementById('tap').addEventListener('click', next);
    autoAdvance(document.getElementById('bar'), 8000);
  }

  function timeLeft() {
    var diff = EXAM_DATE.getTime() - Date.now();
    if (diff <= 0) return { d: 0, h: 0, m: 0, s: 0 };
    return { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5 % 24), m: Math.floor(diff / 6e4 % 60), s: Math.floor(diff / 1e3 % 60) };
  }
  function monthsLeft() {
    var now = new Date();
    var m = (EXAM_DATE.getFullYear() - now.getFullYear()) * 12 + EXAM_DATE.getMonth() - now.getMonth();
    if (now.getDate() > EXAM_DATE.getDate()) m--;
    return Math.max(0, m);
  }
  function screenCountdown() {
    var t = timeLeft();
    var cells = [['d', t.d, 'DIAS'], ['h', t.h, 'HORAS'], ['m', t.m, 'MIN'], ['s', t.s, 'SEG']].map(function (c) {
      return '<div><b id="cd-' + c[0] + '">' + c[1] + '</b><span>' + c[2] + '</span></div>';
    }).join('');
    return '<div class="sheet screen-enter"><div class="interstitial red" id="tap">' +
      '<div class="big-icon in-pop" style="width:72px;height:72px;opacity:.85;margin-bottom:18px">' + icon('calendar', 1.5) + '</div>' +
      '<h2 class="inter-title" style="margin-bottom:20px">Os dias estão passando...</h2>' +
      '<div class="pill">' + icon('calendar') + 'Hoje: ' + new Date().toLocaleDateString('pt-BR') + '</div>' +
      '<div class="pill">' + icon('pencil') + 'ENEM 2026: NOVEMBRO! (Faltam ' + monthsLeft() + ' Meses)</div>' +
      '<div class="countdown-box"><p>Faltam aproximadamente:</p><div class="countdown">' + cells + '</div></div>' +
      '<p class="inter-text">Eu também já perdi muito tempo lendo textos inúteis na prova e tiver que chutar várias no final... até entender que o problema não era falta de estudo, era a falta de uma estratégia para ler só o que importa.</p>' +
      '<div style="width:100%"><div class="inter-bar"><div id="bar"></div></div>' +
      '<p class="inter-hint">Clique na tela para continuar ou aguarde...</p></div>' +
    '</div></div>';
  }
  function bindCountdown() {
    playSound('clock');
    var iv = setInterval(function () {
      var t = timeLeft();
      ['d', 'h', 'm', 's'].forEach(function (k) { var el = document.getElementById('cd-' + k); if (el) el.textContent = t[k]; });
    }, 1000);
    cleanup.push(function () { clearInterval(iv); });
    bindTap();
  }

  function screenApproval() {
    return '<div class="overlay light fade-enter"><div class="approval">' +
      '<div class="approval-head">' + esc(state.mainGoal) + '</div>' +
      '<div class="approval-img"><img src="' + IMG_APPROVAL + '" alt="Sua Aprovação"></div>' +
      '<div class="approval-foot"><h3>Parabéns ' + esc(state.name) + '!</h3>' +
      '<button id="btn-next" class="btn btn-grad">Continuar ' + icon('sparkles') + '</button></div>' +
    '</div></div>';
  }
  var confettiFire = null;
  function getConfetti() {
    // Canvas proprio por cima de tudo (zIndex 1000, igual ao original), sem Web Worker
    // para funcionar em qualquer navegador e hospedagem.
    if (confettiFire) return confettiFire;
    if (!window.confetti || !window.confetti.create) return null;
    var c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000';
    document.body.appendChild(c);
    confettiFire = window.confetti.create(c, { resize: true, useWorker: false });
    return confettiFire;
  }
  function fireConfetti() {
    var confetti = getConfetti();
    if (!confetti) return;
    confetti({ particleCount: 150, spread: 70, origin: { y: .6 }, zIndex: 1000 });
    var end = Date.now() + 1 * 1000;
    (function frame() {
      confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 1000 });
      confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 1000 });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }
  function bindApproval() {
    document.getElementById('btn-next').addEventListener('click', next);
    playSound('approval');
    fireConfetti();
  }

  function screenReal() {
    return '<div class="overlay gradient fade-enter"><div class="real in-scale">' +
      '<h2>Agora, deixa eu te falar a real...</h2>' +
      '<p class="p1">Se você continuar fazendo tudo como tem feito até agora...</p>' +
      '<p class="p2">Lendo textos gigantescos, caindo nas pegadinhas das alternativas e lutando contra o tempo...</p>' +
      '<p class="p3">Essa tela de aprovação vai continuar sendo só um sonho distante.</p>' +
      '<p class="p4">Mas se você quiser, eu posso te mostrar o exato padrão de gatilhos que eu usei para fazer 140 acertos e passar na Federal direto do ensino médio, sem precisar ler os textos da prova.</p>' +
      '<button id="btn-next" class="btn btn-cta">Quero Saber Como!</button>' +
    '</div></div>';
  }
  function bindReal() { document.getElementById('btn-next').addEventListener('click', next); }

  function screenVsl() {
    return '<div class="sheet screen-enter" style="max-width:640px;min-height:0">' + sheetHead('Gabarito') +
      '<div class="sheet-body">' +
        '<p class="vsl-text">E foi assim que eu ajudei mais de 12.000 alunos pelo Brasil todo a identificar a resposta certa no ENEM em segundos.</p>' +
        '<div class="vsl-player"><vturb-smartplayer id="vid-69f64d3730090a44b951fe01" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"></vturb-smartplayer></div>' +
      '</div></div>';
  }
  function bindVsl() {
    var s = document.createElement('script');
    s.src = VTURB_SRC; s.async = true;
    document.head.appendChild(s);
  }

  // ---------- Fluxo (mesma ordem do original) ----------
  function render() {
    runCleanup();
    var i = state.idx, html, bind;
    if (i === 0) { html = screenStart(); bind = bindStart; }
    else if (i >= 1 && i <= 3) { var q1 = QUESTIONS[i - 1]; html = screenQuestion(q1); bind = function () { bindQuestion(q1); }; }
    else if (i === 4) { html = screenEmpathy(); bind = bindTap; }
    else if (i === 5) { var q2 = QUESTIONS[3]; html = screenQuestion(q2); bind = function () { bindQuestion(q2); }; }
    else if (i === 6) { html = screenCountdown(); bind = bindCountdown; }
    else if (i >= 7 && i <= 9) { var q3 = QUESTIONS[i - 3]; html = screenQuestion(q3); bind = function () { bindQuestion(q3); }; }
    else if (i === 10) { html = screenApproval(); bind = bindApproval; }
    else if (i === 11) { html = screenReal(); bind = bindReal; }
    else { html = screenVsl(); bind = bindVsl; }
    app.className = 'app' + (isFull(i) ? ' fullscreen' : '');
    updateTop();
    stage.innerHTML = html;
    window.scrollTo(0, 0);
    bind();
  }
  render();
})();
</script>
</body>
</html>
