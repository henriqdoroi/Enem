<style>
  /* Layout: paginas de um caderno de prova do ENEM empilhadas sobre papel quadriculado */
  :root {
    --blue: #1b4f9c;
    --blue-dark: #12366d;
    --navy: #0b1f44;
    --yellow: #ffc72c;
    --green: #12a150;

    --paper: #ffffff;

  html { scroll-behavior: smooth; }

  }
  img { max-width: 100%; height: auto; display: block; }
  svg.icon { width: 1em; height: 1em; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
  .narrow { max-width: 760px; }
  section { padding-block: 72px; }
  @media (min-width: 768px) { section { padding-block: 96px; } }

  h1, h2, h3, h4 { font-family: var(--serif); margin: 0; text-wrap: balance; }

  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--blue); }

  /* Botões */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%;

  /* Hero: capa do caderno */

  /* Se você... (alternativas A–D) */

  /* O que você vai receber */

  .inside h2.big { text-align: center; font-size: 30px; font-weight: 900; margin-bottom: 36px; color: #fff; }
  @media (min-width: 768px) { .inside h2.big { font-size: 46px; } }
  .product { background: var(--paper); color: var(--ink); border-radius: 24px; padding: 20px; margin-bottom: 32px; box-shadow: 0 30px 60px -25px rgba(0,0,0,.5); }
  @media (min-width: 768px) { .product { padding: 44px; } }
  .product:last-child { margin-bottom: 0; }
  .product h3 { font-size: 24px; font-weight: 800; margin: 32px 0 12px; text-align: center; }
  .product p { font-size: 17px; line-height: 1.6; color: var(--ink-soft); max-width: 640px; margin: 0 auto; text-align: center; }
  .product .hl { background: var(--yellow); color: var(--navy); font-weight: 900; padding: 1px 6px; border-radius: 4px; }

  /* Carrossel */
  .carousel { position: relative; width: 100%; max-width: 560px; margin: 0 auto; }
  .slides { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 100%; overflow: hidden; border-radius: 20px; background: var(--tint); border: 1px solid var(--line); }
  .slide { position: absolute; inset: 0; padding: 12px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(.95); pointer-events: none; transition: all .7s ease-in-out; }
  @media (min-width: 768px) { .slide { padding: 24px; } }
  .slide.on { opacity: 1; transform: scale(1); z-index: 1; pointer-events: auto; }
  .slide img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 25px -10px rgba(11,31,68,.45); border: 1px solid var(--line); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.92); color: var(--blue); display: grid; place-items: center; cursor: pointer; opacity: .85; transition: transform .3s, background .3s, color .3s, opacity .3s; box-shadow: 0 4px 12px rgba(11,31,68,.2); }
  .nav:hover { background: var(--blue); color: #fff; opacity: 1; transform: translateY(-50%) scale(1.1); }
  .nav:active { transform: translateY(-50%) scale(.95); }
  .nav svg { width: 24px; height: 24px; }
  .nav.prev { left: 12px; } .nav.next { right: 12px; }
  .dots { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
  .dots button { height: 10px; width: 10px; border-radius: 99px; border: 0; padding: 0; cursor: pointer; background: #c4ccd9; transition: all .3s; }
  .dots button.on { width: 32px; background: var(--blue); }

  /* Bônus */
  .bonus { position: relative; overflow: hidden; text-align: center; background: var(--paper); border: 2px dashed var(--blue); border-radius: 32px; padding: 56px 20px 44px; }
  @media (min-width: 768px) { .bonus { padding: 56px 48px; } }
  .ribbon { position: absolute; top: 0; right: 0; background: var(--yellow); color: var(--navy); font-weight: 900; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 18px; border-bottom-left-radius: 22px; }
  .bonus .b-big { width: 64px; height: 64px; color: var(--blue); margin: 0 auto 22px; }

  .bonus h2 { font-size: 30px; font-weight: 900; margin-bottom: 16px; }
  @media (min-width: 768px) { .bonus h2 { font-size: 46px; } }
  .bonus p { font-size: 19px; color: var(--ink-soft); line-height: 1.6; max-width: 720px; margin: 0 auto 28px; }
  .pill-green { display: inline-flex; align-items: center; gap: 8px; background: #e3f6ea; color: var(--green-dark); padding: 10px 22px; border-radius: 99px; font-weight: 800; }
  .pill-green svg { width: 18px; height: 18px; }

  /* Oferta: dois planos */
  .until { text-align: center; margin-bottom: 28px; }
  .until span { display: inline-flex; align-items: center; gap: 8px; background: #fff7d6; color: var(--navy); border: 2px solid var(--yellow); padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  .until svg { width: 15px; height: 15px; }
  @keyframes pulse { 50% { opacity: .5; } }
  .plans { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: stretch; }
  .plan.basic { order: 1; } .plan.full { order: 2; }
  @media (min-width: 860px) { .plans { grid-template-columns: 1fr 1fr; } }
  .plan { position: relative; background: var(--paper); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; border: 2px solid var(--line); box-shadow: 0 24px 50px -30px rgba(11,31,68,.45); }
  .plan.full { border: 3px solid var(--blue); box-shadow: 0 0 0 6px rgba(27,79,156,.12), 0 30px 70px -25px rgba(27,79,156,.6); }
  .plan-band { height: 10px; background: #c4ccd9; }
  .plan.full .plan-band { background: var(--blue); border-bottom: 4px solid var(--yellow); height: 14px; }
  .plan-badge { position: absolute; top: 14px; right: 14px; display: inline-flex; align-items: center; gap: 6px; background: var(--yellow); color: var(--navy); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; border-radius: 99px; }
  .plan-badge svg { width: 13px; height: 13px; }
  .plan-body { padding: 30px 22px 26px; display: flex; flex-direction: column; flex: 1; }
  @media (min-width: 768px) { .plan-body { padding: 36px 32px 30px; } }
  .plan-name { font-family: var(--sans); font-size: 13px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .plan.full .plan-name { color: var(--blue); }
  .from { font-weight: 700; color: var(--muted); text-decoration: line-through; font-size: 18px; margin: 0; }
  .price { font-family: var(--serif); font-size: 48px; font-weight: 900; color: var(--ink); margin: 2px 0 4px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .price small { font-size: .45em; font-weight: 800; vertical-align: .9em; margin-right: 4px; }
  .plan.full .price { color: var(--blue); font-size: 58px; }
  .life { font-weight: 800; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 22px; font-size: 12px; }
  .items { list-style: none; margin: 0 0 26px; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .items li { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; line-height: 1.3; }
  .items li .mark { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .items li .mark svg { width: 15px; height: 15px; }

  .btn-outline { background: #fff; color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .btn-outline:hover { background: #f4f6fa; }
  .plan-note { margin: 14px 0 0; text-align: center; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .plan-note svg { width: 14px; height: 14px; color: var(--green); }

  /* Popup R$ 27,90 */
  .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(11,31,68,.72); backdrop-filter: blur(4px); overflow-y: auto; animation: fadeOnly .2s ease-out; }
  .modal[hidden] { display: none; }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
  .modal-card { position: relative; width: 100%; max-width: 460px; margin: auto; background: var(--paper); border-radius: 24px; overflow: hidden; box-shadow: 0 40px 80px -20px rgba(0,0,0,.6); animation: modalIn .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes modalIn { from { opacity: 0; transform: scale(.85) translateY(20px); } to { opacity: 1; transform: none; } }
  .modal-head { background: var(--red, #d62f2f); color: #fff; text-align: center; padding: 16px 48px; font-weight: 900; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .modal-head svg { width: 22px; height: 22px; animation: shake 1.2s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
  .modal-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); color: #fff; display: grid; place-items: center; cursor: pointer; }

  .modal-body { padding: 24px 22px 22px; text-align: center; }
  .modal-body h3 { font-size: 24px; font-weight: 900; line-height: 1.2; margin: 0 0 10px; }
  .modal-body .msub { margin: 0 0 18px; color: var(--ink-soft); line-height: 1.5; }
  .modal-price { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin: 0 0 4px; }
  .modal-price s { color: var(--muted); font-weight: 700; font-size: 18px; }
  .modal-price b { font-family: var(--serif); font-size: 50px; font-weight: 900; color: var(--blue); line-height: 1; font-variant-numeric: tabular-nums; }
  .modal-price b small { font-size: .45em; vertical-align: .9em; margin-right: 3px; }
  .modal-diff { display: inline-block; background: #e3f6ea; color: var(--green-dark); font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 99px; margin: 6px 0 18px; }
  .modal .items { text-align: left; margin-bottom: 20px; }
  .modal .items li.extra { border: 2px solid var(--yellow); background: #fffbea; }
  .modal .items li .new { margin-left: auto; flex-shrink: 0; background: var(--yellow); color: var(--navy); font-size: 10px; font-weight: 900; letter-spacing: .08em; padding: 4px 8px; border-radius: 99px; }
  .modal-no { display: block; width: 100%; margin-top: 14px; background: none; border: 0; padding: 8px; color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .modal-no:hover { color: var(--ink); }
  .link-warn { margin: 10px 0 0; font-size: 13px; font-weight: 700; color: #b42318; }

  /* Faixa de números no topo */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 640px; margin: 0 auto 32px; }
  .stat { border: 2px solid var(--line); border-radius: 14px; padding: 12px 6px; background: #fafbfd; }

  /* Barra fixa no celular */
  .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; transform: translateY(110%); transition: transform .3s ease; }

    '<div class="until"><span>' + icon('timer', 2.4) + 'Desconto válido até ' + today + '</span></div>' +
    '<div class="plans">' +
      '<div class="plan full"><div class="plan-band"></div><span class="plan-badge">' + icon('star') + 'Mais escolhido</span><div class="plan-body">' +
        '<p class="plan-name">Plano Completo</p>' +
        '<p class="from">De R$ 87,99</p>' +
        '<h2 class="price"><small>R$</small>37,90</h2>' +
        '<p class="life">Acesso Vitalício</p>' +
        itemList(PLAN_37) +
        '<a href="#" class="btn btn-green js-buy" data-plan="37">QUERO GARANTIR AGORA</a>' +
        '<p class="plan-note">' + icon('lock', 2.4) + 'Checkout 100% Seguro &amp; Acesso Imediato</p>' +
      '</div></div>' +
      '<div class="plan basic"><div class="plan-band"></div><div class="plan-body">' +
        '<p class="plan-name">Plano Básico</p>' +
        '<p class="from" style="visibility:hidden" aria-hidden="true">De R$ 87,99</p>' +
        '<h2 class="price"><small>R$</small>17,90</h2>' +
        '<p class="life">Acesso Vitalício</p>' +
        itemList(PLAN_17) +
        '<a href="#" class="btn btn-outline js-buy" data-plan="17">QUERO O BÁSICO</a>' +
        '<p class="plan-note">' + icon('lock', 2.4) + 'Checkout 100% Seguro &amp; Acesso Imediato</p>' +
      '</div></div>' +
    '</div>' +
  '</div></section>' +

  // DEPOIMENTOS
  '<section><div class="wrap">' +
    '<div class="sec-title"><h2>+5000 pessoas confiaram no material</h2><p>Quem usa, recomenda</p></div>' +
    '<div class="proofs">' + PROOF_IMGS.map(function (src, i) { return '<div class="proof"><img src="' + src + '" alt="Depoimento ' + (i + 1) + '" loading="lazy" decoding="async"></div>'; }).join('') + '</div>' +
    '<div class="teacher"><h3>Além dos alunos, tem professor aplicando a minha metodologia nas suas salas de aula</h3>' +
      '<div class="wa"><audio id="wa-audio" src="' + AUDIO + '" preload="metadata"></audio><div class="wa-row">' +
        '<div class="wa-avatar">' + icon('mic') + '<i></i></div>' +
        '<button class="wa-play" id="wa-play" aria-label="Tocar">' + icon('play') + '</button>' +
        '<div class="wa-mid"><div class="wave" id="wa-wave">' + BARS.map(function (h) { return '<i style="height:' + h + '%"></i>'; }).join('') + '</div>' +
          '<div class="wa-time"><span id="wa-cur">0:00</span><span>' + icon('star') + ' <b id="wa-dur" style="font-weight:500">1:24</b></span></div></div>' +
        '<button class="wa-speed" id="wa-speed">1.0x</button>' +
      '</div></div>' +
    '</div>' +
  '</div></section>' +

  // GARANTIA
  '<section style="padding-top:24px"><div class="wrap narrow"><div class="guarantee">' +
    '<div class="g-ico">' + icon('shield', 1.6) + '</div>' +
    '<h2>' + icon('shield', 2.4) + 'Risco Zero: Garantia de 7 Dias</h2>' +
    '<p class="txt">Eu confio tanto nesse método que assumo o risco. Teste o material por 7 dias. Se você achar que não consegue aplicar ou não gostar do conteúdo, eu devolvo <strong>100% do seu dinheiro</strong>. Sem perguntas.</p>' +
    '<p class="commit">Compromisso com sua aprovação</p>' +
  '</div></div></section>' +

  // FAQ
  '<section style="padding-top:24px"><div class="wrap" style="max-width:800px"><div class="sec-title"><h2>Perguntas Frequentes</h2></div><div class="faq">' +
    FAQ.map(function (f, i) { return '<div class="faq-item"><button class="faq-q" aria-expanded="false"><span><span class="qn">' + (i + 1) + '.</span>' + f[0] + '</span>' + icon('down') + '</button><p class="faq-a" hidden>' + f[1] + '</p></div>'; }).join('') +
  '</div></div></section>' +

  // CTA FINAL
  '<section class="final" style="padding-top:24px"><div class="wrap" style="max-width:900px">' +
    '<h2>Chega de lutar contra o tempo na hora da prova.</h2>' +
    '<div class="center"><a href="#pricing" class="btn btn-primary js-scroll">SIM, QUERO DESTRAVAR MINHA NOTA NO ENEM</a></div>' +
    '<p class="secure">' + icon('shield') + ' Checkout 100% Seguro &amp; Acesso Imediato</p>' +
  '</div></section>' +

  '<div class="modal" id="upsell" hidden role="dialog" aria-modal="true" aria-labelledby="up-title"><div class="modal-card">' +
    '<div class="modal-head">' + icon('alert', 2.4) + 'Espera!</div>' +
    '<button class="modal-x" id="up-close" aria-label="Fechar">' + icon('x', 2.6) + '</button>' +
    '<div class="modal-body">' +
      '<h3 id="up-title">Leve muito mais por só R$ 10 a mais</h3>' +
      '<p class="msub">Tudo do Plano Básico e mais o PDF com as questões oficiais resolvidas.</p>' +
      '<div class="modal-price"><b><small>R$</small>27,90</b></div>' +
      '<span class="modal-diff">Só R$ 10 a mais que o Básico</span>' +
      itemList(PLAN_27, { onlyIncluded: true, newVs: PLAN_17 }) +
      '<a href="#" class="btn btn-green js-buy" data-plan="27">SIM, QUERO POR R$ 27,90</a>' +
      '<button class="modal-no js-buy" data-plan="17-final">Não, quero só o Básico por R$ 17,90</button>' +
      '<p class="link-warn" id="up-warn" hidden></p>' +
    '</div>' +
  '</div></div>' +

  '<div class="sticky-cta" id="sticky"><div class="sc-txt">Palavras-Chave do ENEM<b>a partir de R$ 17,90</b></div><a href="#pricing" class="btn btn-green js-scroll">VER PLANOS</a></div>' +

  '<footer><div class="wrap"><div class="f-links"><a href="#">Termos de Uso</a><span aria-hidden="true">|</span><a href="#">Política de Privacidade</a></div>' +
    '<p>Copyright © 2026 Palavras-Chave do ENEM. Todos os direitos reservados.</p></div></footer>';

  document.getElementById('root').innerHTML = html;

  // Compra: Básico abre o popup de R$ 27,90; os outros vão direto para o pagamento
  var LINKS = { '17-final': CHECKOUT_17, '27': CHECKOUT_27, '37': CHECKOUT_37 };
  var modal = document.getElementById('upsell'), warn = document.getElementById('up-warn'), lastFocus = null;
  function openModal() { lastFocus = document.activeElement; warn.hidden = true; modal.hidden = false; document.body.style.overflow = 'hidden'; modal.querySelector('.btn').focus(); }
  function closeModal() { modal.hidden = true; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
  function go(plan, btn) {
    var url = LINKS[plan];
    if (!url) {
      // Link ainda nao configurado: avisa em vez de levar para lugar errado
      var msg = 'Link de pagamento do plano de R$ ' + (plan === '37' ? '37,90' : plan === '27' ? '27,90' : '17,90') + ' ainda não configurado.';
      if (!modal.hidden) { warn.textContent = msg; warn.hidden = false; }
      else {
        var w = btn.parentNode.querySelector('.link-warn');
        if (!w) { w = document.createElement('p'); w.className = 'link-warn'; btn.insertAdjacentElement('afterend', w); }
        w.textContent = msg;
      }
      return;
    }
    window.location.href = url;
  }
  document.querySelectorAll('.js-buy').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.preventDefault();
      var plan = b.getAttribute('data-plan');
      if (plan === '17') openModal(); else go(plan, b);
    });
  });
  document.getElementById('up-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  // Barra fixa no celular: aparece depois do topo e some quando os planos estão na tela
  var sticky = document.getElementById('sticky'), pricing = document.getElementById('pricing'), hero = document.querySelector('.hero');
  function onScroll() {
    var r = pricing.getBoundingClientRect(), h = hero.getBoundingClientRect();
    var pricingVisible = r.top < window.innerHeight && r.bottom > 0;
    sticky.classList.toggle('show', h.bottom < 0 && !pricingVisible);
  }
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

  // Rolar até a oferta
  document.querySelectorAll('.js-scroll').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); var el = document.getElementById('pricing'); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
  });

  // Carrosséis (troca a cada 3,5s, pausa com o mouse em cima)
  function setupCarousel(root) {
    var slides = root.querySelectorAll('.slide'), dots = root.querySelectorAll('.dots button'), n = slides.length, cur = 0, paused = false;
    function show(i) { cur = (i + n) % n; slides.forEach(function (s, k) { s.classList.toggle('on', k === cur); }); dots.forEach(function (d, k) { d.classList.toggle('on', k === cur); }); }
    var timer = setInterval(function () { if (!paused) show(cur + 1); }, 3500);
    function restart() { clearInterval(timer); timer = setInterval(function () { if (!paused) show(cur + 1); }, 3500); }
    root.querySelector('.prev').addEventListener('click', function (e) { e.preventDefault(); show(cur - 1); restart(); });
    root.querySelector('.next').addEventListener('click', function (e) { e.preventDefault(); show(cur + 1); restart(); });
    dots.forEach(function (d, k) { d.addEventListener('click', function (e) { e.preventDefault(); show(k); restart(); }); });
    root.addEventListener('mouseenter', function () { paused = true; });
    root.addEventListener('mouseleave', function () { paused = false; });
    // Deslizar o dedo no celular
    var x0 = null;
    root.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    root.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { show(cur + (dx < 0 ? 1 : -1)); restart(); } x0 = null; });
  }
  setupCarousel(document.getElementById('car1'));
  setupCarousel(document.getElementById('car2'));

  // FAQ
  document.querySelectorAll('.faq-item').forEach(function (item) {
    var q = item.querySelector('.faq-q'), a = item.querySelector('.faq-a');
    q.addEventListener('click', function () {
      var open = a.hidden;
      a.hidden = !open; item.classList.toggle('open', open); q.setAttribute('aria-expanded', open);
      q.querySelector('svg').outerHTML = icon(open ? 'up' : 'down');
    });
  });

  // Player de áudio
  (function () {
    var audio = document.getElementById('wa-audio'), play = document.getElementById('wa-play'), speedBtn = document.getElementById('wa-speed');
    var bars = document.querySelectorAll('#wa-wave i'), cur = document.getElementById('wa-cur'), dur = document.getElementById('wa-dur');
    var N = bars.length, duration = 0, playing = false, rate = 1;
    function fmt(t) { if (isNaN(t)) return '0:00'; var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
    function paint() { var p = duration > 0 ? audio.currentTime / duration : 0, lit = Math.floor(p * N); bars.forEach(function (b, i) { b.classList.toggle('on', i <= lit && (playing || audio.currentTime > 0)); }); cur.textContent = fmt(audio.currentTime); }
    function setDur() { if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) { duration = audio.duration; dur.textContent = fmt(duration); } }
    function setPlaying(v) { playing = v; play.innerHTML = icon(v ? 'pause' : 'play'); play.setAttribute('aria-label', v ? 'Pausar' : 'Tocar'); }
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('loadedmetadata', setDur);
    audio.addEventListener('durationchange', setDur);
    audio.addEventListener('ended', function () { setPlaying(false); audio.currentTime = 0; paint(); });
    play.addEventListener('click', function (e) {
      e.preventDefault();
      if (playing) { audio.pause(); setPlaying(false); }
      else { audio.play().catch(function (err) { console.log("Audio play error:", err); setPlaying(false); }); setPlaying(true); }
    });
    speedBtn.addEventListener('click', function (e) {
      e.preventDefault();
      rate = rate === 1 ? 1.5 : rate === 1.5 ? 2 : 1;
      audio.playbackRate = rate; speedBtn.textContent = rate === 1 ? '1.0x' : rate === 1.5 ? '1.5x' : '2.0x';
    });
    bars.forEach(function (b, i) { b.addEventListener('click', function () { if (!duration) return; audio.currentTime = (i / N) * duration; paint(); }); });
    setDur();
  })();
})();
</script>
</body>
</html>
